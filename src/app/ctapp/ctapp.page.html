<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title><img src="../../assets/icon/CT_Logo.svg" class="ctlogo"> ChurchTools App</ion-card-title>
      <br>
      <p class="text">{{ 'CTAPP.INTRO' | translate }}</p>
    </ion-card-header>
    <ion-card-content>
      <ion-card-subtitle>{{ 'CTAPP.STEP1' | translate }}</ion-card-subtitle>
      <p class="text">{{ 'CTAPP.STEP1_TEXT' | translate }}</p>
      <div *ngIf="AppPlatform === 'android'">
       
          <img class="ct-centered-img" src="/assets/icon/playstore.png" (click)="openWebsite('https://play.google.com/store/apps/details?id=tools.church.app')">
       
      </div>
      <div *ngIf="AppPlatform  === 'iOS'">
        
          <img class="ct-centered-img" src="/assets/icon/appstore.png" (click)="openWebsite('https://itunes.apple.com/de/app/id1413263051')">
        
      </div>
      <br>
        <ion-card-subtitle>{{ 'CTAPP.STEP2' | translate }}</ion-card-subtitle>
        <p class="text">{{ 'CTAPP.STEP2_TEXT' | translate }}</p>
       
          <ion-button class="ct-centered" (click)="openCtApp()">{{ 'CTAPP.CONNECT' | translate }}</ion-button>
      
    </ion-card-content>
  </ion-card>
</ion-content>
