<ion-header>
  <ion-toolbar class="head">
    <ion-label slot="start">{{ 'LOGIN.TITLE' | translate }}</ion-label>
    <ion-button slot="end" (click)="dismiss()">{{ 'COMMON.BACK' | translate }}</ion-button>
    &nbsp;&nbsp;
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item>
    <ion-label>{{ 'LOGIN.USERNAME' | translate }}</ion-label>
    <ion-input type="text" [(ngModel)]="username"></ion-input>
  </ion-item>
  <ion-item>
    <ion-label>{{ 'LOGIN.PASSWORD' | translate }}</ion-label>
    <ion-input type="password" [(ngModel)]="password"></ion-input>
  </ion-item>
  <ion-button (click)="login()" expand="block">{{ 'LOGIN.BUTTON' | translate }}</ion-button>
  <ion-item>
    &nbsp;<br>
    {{ 'LOGIN.INFO' | translate }}
  <br>&nbsp;
  </ion-item>
</ion-content>
