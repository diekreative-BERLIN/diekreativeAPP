

<ion-content>
  
    <div class="tagundnacht-title" style="background-color: #fff;">
      <ion-label class="header-label" color="light">{{ 'MINISTRY.TITLE' | translate }}</ion-label>
  </div>




<ion-label><div class="subtitle" [innerHTML]="'MINISTRY.SUBTITLE' | translate"></div></ion-label>

<div class="m_info">

    <ion-icon name="reader-outline"></ion-icon>

  </ion-button>

</div>
