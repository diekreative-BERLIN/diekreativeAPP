<ion-content>
  <div style="width:100%; height:209px; background-image: url(../../assets/headerimages/Header_Unterseiten_LIFEGROUP.jpg); background-size: cover;">
    <h1 class="lifegroup-title">{{ 'LIFEGROUPS.TITLE' | translate }}</h1>
  </div>
  <h1 class="lifegroup-text">{{ 'LIFEGROUPS.JOIN' | translate }}</h1>
  <h2 class="lifegroup-text">{{ 'LIFEGROUPS.GET_IN_TOUCH' | translate }}</h2>
  <p class="lifegroup-text" [innerHTML]="'LIFEGROUPS.INTRO' | translate"></p> 

  <div class="pfeil-re"><img src="../assets/svg/pfeil_yellow_1.svg" id="pfeile" > </div>
  <div class="pfeil-blue"><img src="../assets/svg/pfeil_blue_1.svg" id="pfeile" > </div>

    -->
    <p class="lifegroup-text">{{ 'LIFEGROUPS.OVERVIEW' | translate }}</p>

     <iframe appIframeTracker width="100%" style="border-width:0px" height="900px" [src]="url"></iframe>
